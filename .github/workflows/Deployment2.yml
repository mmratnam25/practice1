name: Deployment exercise 2
on: push
jobs:
    lnit:
      runs-on: ubuntu-latest
      steps:
          - name: Get Code
            uses: actions/checkout@v3
          - name: Install dependencies
            run: npm ci
          - name: Lint
            run: npm run lint
    test:
      runs-on: ubuntu-latest
      steps:
          - name: Get Code
            uses: actions/checkout@v3
          - name: Install dependencies
            run: npm ci
          - name: Test code
            run: npm run test
          - name: Build Code
            run: npm run build
    deploy:
        runs-on: ubuntu-latest
        steps:
          - name: Get Code
            uses: actions/checkout@v3
          - name: Install dependencies
            run: npm ci
          - name: Build Code
            run: npm run build
          - name: Deploy Code
            run: echo "Deploying Code"   
